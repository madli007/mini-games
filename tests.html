<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testi · MINI GAMES</title>
<link rel="stylesheet" href="shared/ui.css">
<style>
  pre { white-space: pre-wrap; font: 14px/1.5 var(--mg-font-mono); }
  .ok { color: var(--mg-green); } .bad { color: var(--mg-red); }
</style>
</head>
<body class="mg">
  <main class="mg-container mg-stack">
    <h1 class="mg-title">Testi</h1>
    <p class="mg-muted">Čista logika: PRNG, dnevni seed, kode sob, nivoji, register iger, lokalni adapter, prenos hosta.
      Testi uporabljajo svojo predpono v localStorage (mg-test:), zato tvoj profil in rezultati ostanejo.</p>
    <div class="mg-card"><pre id="out">Poganjam …</pre></div>
  </main>
  <script type="module">
    import { runAll } from './tests/tests.js';
    const out = document.getElementById('out');
    out.textContent = '';
    const games = await (await fetch('games.json', { cache: 'no-cache' })).json();
    const schema = await (await fetch('games.schema.json', { cache: 'no-cache' })).json();
    const schemaSql = await (await fetch('supabase/schema.sql', { cache: 'no-cache' })).text();
    const kIdx = await (await fetch('games/krogla/levels/index.json', { cache: 'no-cache' })).json();
    const kroglaLevels = await Promise.all(kIdx.levels.map(async f => (await fetch('games/krogla/levels/' + f, { cache: 'no-cache' })).json()));
    const kroglaCups = await (await fetch('games/krogla/levels/cups.json', { cache: 'no-cache' })).json();
    const rIdx = await (await fetch('games/rusilec/arenas/index.json', { cache: 'no-cache' })).json();
    const rusilecArenas = await Promise.all(rIdx.arenas.map(async f => (await fetch('games/rusilec/arenas/' + f, { cache: 'no-cache' })).json()));
    const fIdx = await (await fetch('games/frnikole/tracks/index.json', { cache: 'no-cache' })).json();
    const frnikoleTracks = await Promise.all(fIdx.tracks.map(async f => (await fetch('games/frnikole/tracks/' + f, { cache: 'no-cache' })).json()));
    const sIdx = await (await fetch('games/skoki/hills/index.json', { cache: 'no-cache' })).json();
    const skokiHills = await Promise.all(sIdx.hills.map(async f => (await fetch('games/skoki/hills/' + f, { cache: 'no-cache' })).json()));
    const skokiParams = await (await fetch('games/skoki/physics-params.json', { cache: 'no-cache' })).json();
    const skokiSql = await (await fetch('supabase/games/skoki.sql', { cache: 'no-cache' })).text();
    const skokiRef = await (await fetch('tests/fixtures/skoki-ref.json', { cache: 'no-cache' })).json();
    const skokiBotRef = await (await fetch('tests/fixtures/skoki-bot-ref.json', { cache: 'no-cache' })).json();
    const skokiCareerOld = await (await fetch('tests/fixtures/skoki-career-old.json', { cache: 'no-cache' })).json();
    const herodleFixture = await (await fetch('tests/fixtures/herodle-compare.json', { cache: 'no-cache' })).json();
    const herodleHeroesSql = await (await fetch('supabase/games/herodle-heroes.sql', { cache: 'no-cache' })).text();
    const herodleHintsSql = await (await fetch('supabase/games/herodle-hints.sql', { cache: 'no-cache' })).text();
    const gIdx = await (await fetch('games/gneca/levels/index.json', { cache: 'no-cache' })).json();
    const gnecaLevels = await Promise.all(gIdx.sets.flatMap(s => s.levels).map(async f => (await fetch('games/gneca/levels/' + f, { cache: 'no-cache' })).json()));
    const log = s => {
      const line = document.createElement('div');
      line.textContent = s;
      line.className = s.startsWith('✔') ? 'ok' : s.startsWith('✘') ? 'bad' : '';
      out.appendChild(line);
    };
    const { fails } = await runAll(log, { games, schema, schemaSql, kroglaLevels, kroglaCups, rusilecArenas, herodleFixture, herodleHeroesSql, herodleHintsSql, frnikoleTracks, skokiHills, skokiParams, skokiSql, skokiRef, skokiBotRef, skokiCareerOld, gnecaLevels });
    document.title = (fails ? '✘ ' : '✔ ') + document.title;
  </script>
</body>
</html>
